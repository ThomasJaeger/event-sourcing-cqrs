<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#3B82F6"/>

  <text x="120" y="80" font-size="14" font-weight="bold" fill="#6B7280" letter-spacing="2">CAPABILITY 6 OF 6</text>
  <text x="120" y="135" font-size="44" font-weight="bold" fill="#111827">Compliance Hedge</text>
  <text x="120" y="175" font-size="22" fill="#6B7280" font-style="italic">Survives regulatory questions you cannot anticipate today.</text>

  <rect x="120" y="220" width="1040" height="125" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="145" y="252" font-size="16" font-weight="bold" fill="#92400E" letter-spacing="1">WHAT THIS MEANS</text>
  <text x="145" y="285" font-size="20" fill="#111827">Future regulations will ask for data we did not plan to keep. Future audits will ask questions we did</text>
  <text x="145" y="312" font-size="20" fill="#111827">not anticipate. Event sourcing is insurance: the data is already captured, even if we did not know why.</text>

  <text x="120" y="385" font-size="16" font-weight="bold" fill="#6B7280" letter-spacing="1">WHAT IT ENABLES</text>

  <rect x="120" y="405" width="333" height="110" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="140" y="435" font-size="18" font-weight="bold" fill="#111827">Future audits answerable</text>
  <text x="140" y="465" font-size="15" fill="#6B7280">When the regulator asks for data</text>
  <text x="140" y="485" font-size="15" fill="#6B7280">from three years ago, the answer</text>
  <text x="140" y="505" font-size="15" fill="#6B7280">is &quot;yes.&quot; Without scrambling.</text>

  <rect x="473" y="405" width="333" height="110" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="493" y="435" font-size="18" font-weight="bold" fill="#111827">New regulations, no panic</text>
  <text x="493" y="465" font-size="15" fill="#6B7280">A new privacy or financial rule</text>
  <text x="493" y="485" font-size="15" fill="#6B7280">requires reporting on past data?</text>
  <text x="493" y="505" font-size="15" fill="#6B7280">Build the report. Data is there.</text>

  <rect x="826" y="405" width="334" height="110" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="846" y="435" font-size="18" font-weight="bold" fill="#111827">Stronger negotiation</text>
  <text x="846" y="465" font-size="15" fill="#6B7280">In disputes with customers,</text>
  <text x="846" y="485" font-size="15" fill="#6B7280">vendors, or regulators, the full</text>
  <text x="846" y="505" font-size="15" fill="#6B7280">history is on our side.</text>

  <rect x="120" y="555" width="1040" height="105" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="145" y="585" font-size="16" font-weight="bold" fill="#92400E" letter-spacing="1">CONCRETE EXAMPLE</text>
  <text x="145" y="615" font-size="18" fill="#111827" font-style="italic">"A new compliance requirement asked for retroactive reporting on customer consent changes. Three</text>
  <text x="145" y="640" font-size="18" fill="#111827" font-style="italic">years of consent events were already in the log. Competitors spent months retrofitting; we shipped."</text>

  <text x="1160" y="700" font-size="14" fill="#9CA3AF" text-anchor="end">Slide 8 of 12</text>
</svg>
