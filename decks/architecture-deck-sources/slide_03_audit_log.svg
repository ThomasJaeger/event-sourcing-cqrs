<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#3B82F6"/>

  <text x="120" y="80" font-size="14" font-weight="bold" fill="#6B7280" letter-spacing="2">CAPABILITY 1 OF 6</text>
  <text x="120" y="135" font-size="44" font-weight="bold" fill="#111827">100% Audit Log</text>
  <text x="120" y="175" font-size="22" fill="#6B7280" font-style="italic">Every change traceable to who did it, when, and why. Without effort.</text>

  <!-- What this means box -->
  <rect x="120" y="220" width="1040" height="125" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="145" y="252" font-size="16" font-weight="bold" fill="#1E40AF" letter-spacing="1">WHAT THIS MEANS</text>
  <text x="145" y="285" font-size="20" fill="#111827">Instead of recording the current state of accounts, orders, and customers, the system records every</text>
  <text x="145" y="312" font-size="20" fill="#111827">change as it happens. Nothing is overwritten. The history is the data, not a side effect of it.</text>

  <!-- What it enables -->
  <text x="120" y="385" font-size="16" font-weight="bold" fill="#6B7280" letter-spacing="1">WHAT IT ENABLES</text>

  <rect x="120" y="405" width="333" height="110" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="140" y="435" font-size="18" font-weight="bold" fill="#111827">Regulatory response</text>
  <text x="140" y="465" font-size="15" fill="#6B7280">Auditor requests answered in</text>
  <text x="140" y="485" font-size="15" fill="#6B7280">minutes, not days. The audit log</text>
  <text x="140" y="505" font-size="15" fill="#6B7280">is the system itself.</text>

  <rect x="473" y="405" width="333" height="110" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="493" y="435" font-size="18" font-weight="bold" fill="#111827">Customer support</text>
  <text x="493" y="465" font-size="15" fill="#6B7280">"Why did my account get</text>
  <text x="493" y="485" font-size="15" fill="#6B7280">charged twice?" answered with</text>
  <text x="493" y="505" font-size="15" fill="#6B7280">the actual sequence of events.</text>

  <rect x="826" y="405" width="334" height="110" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="846" y="435" font-size="18" font-weight="bold" fill="#111827">Bug investigation</text>
  <text x="846" y="465" font-size="15" fill="#6B7280">"What was the system seeing</text>
  <text x="846" y="485" font-size="15" fill="#6B7280">when it made that decision?"</text>
  <text x="846" y="505" font-size="15" fill="#6B7280">becomes a query, not a guess.</text>

  <!-- Concrete example -->
  <rect x="120" y="555" width="1040" height="105" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="145" y="585" font-size="16" font-weight="bold" fill="#92400E" letter-spacing="1">CONCRETE EXAMPLE</text>
  <text x="145" y="615" font-size="18" fill="#111827" font-style="italic">"When the auditor asked why account X was charged twice on March 14, we answered in 5</text>
  <text x="145" y="640" font-size="18" fill="#111827" font-style="italic">minutes with the full sequence of events. Not 3 days of log spelunking.&quot;</text>

  <text x="1160" y="700" font-size="14" fill="#9CA3AF" text-anchor="end">Slide 3 of 12</text>
</svg>
