<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#3B82F6"/>

  <text x="120" y="80" font-size="14" font-weight="bold" fill="#6B7280" letter-spacing="2">CAPABILITY 2 OF 6</text>
  <text x="120" y="135" font-size="44" font-weight="bold" fill="#111827">Time-Travel</text>
  <text x="120" y="175" font-size="22" fill="#6B7280" font-style="italic">Reconstruct the exact state of any account, order, or system at any past moment.</text>

  <rect x="120" y="220" width="1040" height="125" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <text x="145" y="252" font-size="16" font-weight="bold" fill="#047857" letter-spacing="1">WHAT THIS MEANS</text>
  <text x="145" y="285" font-size="20" fill="#111827">Because the system stores events rather than overwriting state, we can replay events up to any</text>
  <text x="145" y="312" font-size="20" fill="#111827">point in time and see exactly what the system looked like then. The past is never lost.</text>

  <text x="120" y="385" font-size="16" font-weight="bold" fill="#6B7280" letter-spacing="1">WHAT IT ENABLES</text>

  <rect x="120" y="405" width="333" height="110" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="140" y="435" font-size="18" font-weight="bold" fill="#111827">Historical reporting</text>
  <text x="140" y="465" font-size="15" fill="#6B7280">"What would last quarter look</text>
  <text x="140" y="485" font-size="15" fill="#6B7280">like under our new churn</text>
  <text x="140" y="505" font-size="15" fill="#6B7280">definition?&quot; Answerable.</text>

  <rect x="473" y="405" width="333" height="110" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="493" y="435" font-size="18" font-weight="bold" fill="#111827">Post-incident reconstruction</text>
  <text x="493" y="465" font-size="15" fill="#6B7280">Replay events to the moment of</text>
  <text x="493" y="485" font-size="15" fill="#6B7280">the incident; see exactly what</text>
  <text x="493" y="505" font-size="15" fill="#6B7280">the system was doing.</text>

  <rect x="826" y="405" width="334" height="110" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <text x="846" y="435" font-size="18" font-weight="bold" fill="#111827">New metrics, old data</text>
  <text x="846" y="465" font-size="15" fill="#6B7280">Define a metric today, compute</text>
  <text x="846" y="485" font-size="15" fill="#6B7280">it back across years of history.</text>
  <text x="846" y="505" font-size="15" fill="#6B7280">No "we don't have that data."</text>

  <rect x="120" y="555" width="1040" height="105" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="145" y="585" font-size="16" font-weight="bold" fill="#92400E" letter-spacing="1">CONCRETE EXAMPLE</text>
  <text x="145" y="615" font-size="18" fill="#111827" font-style="italic">"Marketing wanted to know how the new pricing tier would have performed if launched a year</text>
  <text x="145" y="640" font-size="18" fill="#111827" font-style="italic">earlier. We replayed the events with the new logic. Had the answer the next day.&quot;</text>

  <text x="1160" y="700" font-size="14" fill="#9CA3AF" text-anchor="end">Slide 4 of 12</text>
</svg>
